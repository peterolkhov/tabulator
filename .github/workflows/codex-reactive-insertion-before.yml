name: Tabulator pinned reactive insertion diagnosis
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-reactive-insertion-order]
permissions:
  contents: read
jobs:
  native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tabulator-tables/tabulator
          ref: c9a7e67287557adba1fdde50a6e0e5c463a50769
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install frozen diagnostic and capture original source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,zlib,json,os
          from pathlib import Path
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          r=Path(os.environ['RUNNER_TEMP'])
          for name in ['guard','assess']:(r/('tab-'+name+'.py')).write_text(assets[name])
          for name,path in [('fixture','test/e2e/reactive-array-order.spec.js'),('config','playwright.before.config.mjs')]:
           p=Path(path);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(assets[name])
          PYASSETS
          python3 "$RUNNER_TEMP/tab-guard.py" before
      - name: Install frozen native development dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 "$RUNNER_TEMP/tab-guard.py" after-install
      - name: Build native distribution without mutating prebuild lint hook
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- rollup -c build/rollup.mjs
          python3 "$RUNNER_TEMP/tab-guard.py" after-build
      - name: Install official Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- playwright install --with-deps chromium
      - name: Require exact finite native observations
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/tab-before-results.json" npm exec -- playwright test --config playwright.before.config.mjs --reporter=line,json 2>&1 | tee "$RUNNER_TEMP/tab-before.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/tab-before-exit.txt"
          echo TAB_NATIVE_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/tab-before-results.json"
          echo TAB_NATIVE_RAW_JSON_END
          python3 "$RUNNER_TEMP/tab-assess.py" "$RUNNER_TEMP"
      - name: Verify all tracked source and frozen fixtures after all work
        if: always()
        shell: bash
        run: python3 "$RUNNER_TEMP/tab-guard.py" final
