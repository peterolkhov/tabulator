name: Tabulator reactive child refresh native verification
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-tabulator-tree86]
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tabulator-tables/tabulator
          ref: c9a7e67287557adba1fdde50a6e0e5c463a50769
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Verify official checkout and declared indexed patch with native RED GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import json, zlib, base64, os
          from pathlib import Path
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          p=Path(os.environ['RUNNER_TEMP']);(p/'tree86-assets.json').write_text(json.dumps(assets))
          for name in ['guard','driver']: (p/('tree86-'+name+'.py')).write_text(assets[name])
          PYASSETS
          python3 "$RUNNER_TEMP/tree86-driver.py"
