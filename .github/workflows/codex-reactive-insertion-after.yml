name: Tabulator reactive insertion candidate verification
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-reactive-insertion-order]
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 238cfd5efcca351e6c1b5899d281fec66886dfae
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Verify exact candidate and native RED GREEN with baseline comparisons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import json,zlib,base64,os
          from pathlib import Path
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          assert len(assets['candidate_sha'])==40 and len(assets['candidate_tree'])==40
          p=Path(os.environ['RUNNER_TEMP']);(p/'tab-assets.json').write_text(json.dumps(assets))
          for name in ['guard','driver']:(p/('tab-'+name+'.py')).write_text(assets[name])
          PYASSETS
          python3 "$RUNNER_TEMP/tab-driver.py"
