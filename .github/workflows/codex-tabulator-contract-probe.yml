name: Tabulator original public getter and tree contract probe
on:
  workflow_dispatch:
  push:
    branches: [codex/probe-tabulator-identity-tree]
permissions:
  contents: read
jobs:
  native-contract-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tabulator-tables/tabulator
          ref: c9a7e67287557adba1fdde50a6e0e5c463a50769
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install frozen probe and guard original checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import json,zlib,base64,os
          from pathlib import Path
          assets=json.loads(zlib.decompress(base64.b64decode('')));temp=Path(os.environ['RUNNER_TEMP'])
          for name in ['guard','assess']:(temp/('tab-contract-'+name+'.py')).write_text(assets[name])
          for name,path in [('fixture','test/e2e/identity-tree.spec.js'),('config','playwright.probe.config.mjs')]:
           p=Path(path);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(assets[name])
          PYASSETS
          python3 "$RUNNER_TEMP/tab-contract-guard.py" before
      - name: Install pinned native dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 "$RUNNER_TEMP/tab-contract-guard.py" after-install
          npm exec -- playwright install --with-deps chromium
      - name: Build exact original via native Rollup without prebuild fixes
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- rollup -c build/rollup.mjs
          python3 "$RUNNER_TEMP/tab-contract-guard.py" after-build
      - name: Record original contract observations outcome neutrally
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/tab-contract-guard.py" before-run
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/tab-contract-results.json" npm exec -- playwright test --config playwright.probe.config.mjs --reporter=line,json 2>&1 | tee "$RUNNER_TEMP/tab-contract.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/tab-contract-exit.txt"
          echo TAB_CONTRACT_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/tab-contract-results.json"
          echo TAB_CONTRACT_RAW_JSON_END
          python3 "$RUNNER_TEMP/tab-contract-assess.py" "$RUNNER_TEMP"
      - name: Assert final exact source fixtures and consumed JS CSS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/tab-contract-guard.py" final
