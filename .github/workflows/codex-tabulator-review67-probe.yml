name: Tabulator review67 negative delete count probe
on:
  workflow_dispatch:
  push:
    branches: [codex/probe-tabulator-review67]
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tabulator-tables/tabulator
          ref: c9a7e67287557adba1fdde50a6e0e5c463a50769
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tabulator-tables/tabulator
          ref: c9a7e67287557adba1fdde50a6e0e5c463a50769
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Prepare frozen reviewed overlays and exact fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import json,zlib,base64,os,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);assets=json.loads(zlib.decompress(base64.b64decode('')));(p/'tab67-assets.json').write_text(json.dumps(assets))
          for name in ['guard','assess']:(p/('tab67-'+name+'.py')).write_text(assets[name])
          for mode in ['baseline','candidate']:
           root=Path(mode)
           if mode=='candidate':
            for record in assets['manifest']['files']:
             target=root/record['path'];raw=assets['candidate'][record['path']].encode()
             if record['original_git_blob']:
              original=target.read_bytes();assert hashlib.sha256(original).hexdigest()==record['original_sha256'];assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()==record['original_git_blob']
             else:assert not target.exists()
             target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
           for name,raw in assets['frozen'].items():
            target=root/name;assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True);target.write_text(raw)
          PYASSETS
      - name: Guard both originals and frozen candidate overlay
        shell: bash
        run: |
          set -euo pipefail
          for mode in baseline candidate; do
            (cd "$mode" && python3 "$RUNNER_TEMP/tab67-guard.py" "$mode" before)
          done
      - name: Install immutable native dependencies once
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && npm ci)
          ln -s "$GITHUB_WORKSPACE/baseline/node_modules" candidate/node_modules
          for mode in baseline candidate; do
            (cd "$mode" && python3 "$RUNNER_TEMP/tab67-guard.py" "$mode" after-install)
          done
          (cd baseline && npm exec -- playwright install --with-deps chromium)
      - name: Build baseline via native Rollup without prebuild fix
        shell: bash
        run: |
          set -euo pipefail
          cd baseline
          npm exec -- rollup -c build/rollup.mjs
          python3 "$RUNNER_TEMP/tab67-guard.py" baseline after-build
      - name: Observe baseline review fixture without expected outcome
        shell: bash
        run: |
          set -euo pipefail
          cd baseline
          python3 "$RUNNER_TEMP/tab67-guard.py" baseline before-run
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/tab67-baseline.json" npm exec -- playwright test --config playwright.review67.config.mjs --reporter=line,json 2>&1 | tee "$RUNNER_TEMP/tab67-baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/tab67-baseline-exit.txt"
          echo TAB67_RAW_BASELINE_JSON_BEGIN
          cat "$RUNNER_TEMP/tab67-baseline.json"
          echo TAB67_RAW_BASELINE_JSON_END
          python3 "$RUNNER_TEMP/tab67-assess.py" "$RUNNER_TEMP" baseline
      - name: Build candidate via native Rollup without prebuild fix
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          npm exec -- rollup -c build/rollup.mjs
          python3 "$RUNNER_TEMP/tab67-guard.py" candidate after-build
      - name: Observe candidate review fixture without expected outcome
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 "$RUNNER_TEMP/tab67-guard.py" candidate before-run
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/tab67-candidate.json" npm exec -- playwright test --config playwright.review67.config.mjs --reporter=line,json 2>&1 | tee "$RUNNER_TEMP/tab67-candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/tab67-candidate-exit.txt"
          echo TAB67_RAW_CANDIDATE_JSON_BEGIN
          cat "$RUNNER_TEMP/tab67-candidate.json"
          echo TAB67_RAW_CANDIDATE_JSON_END
          python3 "$RUNNER_TEMP/tab67-assess.py" "$RUNNER_TEMP" candidate
      - name: Enforce final source fixture and consumed artifact stability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for mode in baseline candidate; do
            (cd "$mode" && python3 "$RUNNER_TEMP/tab67-guard.py" "$mode" final)
          done
